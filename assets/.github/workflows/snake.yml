name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # cada 12 horas
  workflow_dispatch:          # botón "Run workflow" manual
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-jjk.svg?color_snake=#FF8A3D&color_dots=#1B2040,#4A2F45,#8A4A5C,#E8505B,#FF8A3D
            dist/snake-jjk-light.svg?color_snake=#E8505B&color_dots=#EDEDF5,#F4C7CF,#F4A6B4,#FF8A3D,#E8505B

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
