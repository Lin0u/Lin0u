<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <pattern id="dots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.6" fill="#7C3AED" opacity="0.10"/>
    </pattern>
    <pattern id="dotsDark" width="8" height="8" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.5" fill="#0F1220" opacity="0.55"/>
    </pattern>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F3EEFA"/>
    </linearGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="0.5" stop-color="#C084FC"/>
      <stop offset="1" stop-color="#FF8A3D"/>
    </linearGradient>
    <radialGradient id="aura" cx="1010" cy="160" r="430" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.2" stop-color="#E9D5FF"/>
      <stop offset="0.5" stop-color="#C4A1F5"/>
      <stop offset="0.8" stop-color="#EDE4FA"/>
      <stop offset="1" stop-color="#F3EEFA"/>
    </radialGradient>
    <linearGradient id="fadeGrad" x1="600" y1="0" x2="880" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </linearGradient>
    <mask id="fade"><rect width="1200" height="320" fill="url(#fadeGrad)"/></mask>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="smoke" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.03" numOctaves="4" seed="7">
        <animate attributeName="baseFrequency" dur="14s" values="0.012 0.03;0.017 0.024;0.012 0.03" repeatCount="indefinite"/>
      </feTurbulence>
      <feDisplacementMap in="SourceGraphic" scale="60"/>
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="22"/></filter>
    <style>
      .title { font: 900 92px 'Courier New', ui-monospace, monospace; letter-spacing: 6px; }
      .sub   { font: 700 22px 'Courier New', ui-monospace, monospace; letter-spacing: 2px; }
      .tag   { font: 700 16px 'Courier New', ui-monospace, monospace; letter-spacing: 3px; }
      .pulse  { animation: pulse 2.4s ease-in-out infinite; }
      .drift  { animation: drift 6s ease-in-out infinite; }
      .spinR  { animation: spin 60s linear infinite reverse; transform-origin: 0 0; }
      .spin   { animation: spin 40s linear infinite; transform-origin: 0 0; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes pulse { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
      @keyframes drift { 0%,100% { transform: translateX(0) } 50% { transform: translateX(-12px) } }
      @keyframes spin { to { transform: rotate(360deg) } }
      @keyframes blink { 50% { opacity: 0 } }
    </style>
  </defs>

  <!-- fondo -->
  <rect width="1200" height="320" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="320" rx="18" fill="url(#dots)"/>

  <!-- panel derecho -->
  <g mask="url(#fade)">
    <rect x="560" y="0" width="640" height="320" rx="18" fill="url(#aura)"/>
    <g filter="url(#smoke)" class="drift" opacity="0.55">
      <ellipse cx="1000" cy="175" rx="200" ry="110" fill="#A78BFA"/>
      <ellipse cx="1090" cy="95" rx="110" ry="60" fill="#DDD6FE" opacity="0.8"/>
      <ellipse cx="900" cy="265" rx="170" ry="55" fill="#C4B5FD"/>
    </g>
    <rect x="560" y="0" width="640" height="320" fill="url(#dots)" opacity="0.6"/>
  </g>

  <!-- anillos -->
  <g transform="translate(1010,160)" fill="none">
    <circle r="132" stroke="#7C3AED" stroke-opacity="0.22" stroke-width="1.5"/>
    <g class="spinR">
      <circle r="150" stroke="#F06A12" stroke-opacity="0.7" stroke-width="2" stroke-dasharray="2 14" stroke-linecap="round"/>
    </g>
    <circle r="178" stroke="#7C3AED" stroke-opacity="0.10" stroke-width="1"/>
  </g>

  <!-- símbolo -->
  <circle cx="1010" cy="160" r="95" fill="#FFFFFF" opacity="0.9" filter="url(#soft)" class="pulse"/>
